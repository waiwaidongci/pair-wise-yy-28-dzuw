<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style><h1>影视拍摄连续性管理</h1><section><h2>连续性报告</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button><button onclick="state0()">查看快照</button><pre id="state"></pre></section><section><h2>演员与角色</h2><div class="grid"><input id="actorname" placeholder="演员姓名"><input id="actornote" placeholder="演员备注"><input id="rolename" placeholder="角色名"><input id="leadactor" type="number" placeholder="主演演员 ID"><input id="rolenote" placeholder="角色备注"><input id="role" type="number" placeholder="角色 ID"><input id="actor" type="number" placeholder="演员 ID"></div><button onclick="addActor()">登记演员</button><button onclick="addRole()">登记角色(主演)</button><button onclick="changeLead()">更换主演</button><button onclick="addStandin()">登记替身</button><button onclick="removeStandin()">移除替身</button><button onclick="fileRotation()">轮换备案(审片)</button><pre id="cast"></pre></section><section><h2>拍摄安排</h2><select id="shottype"><option value="dialogue">对白</option><option value="action">动作</option></select><button onclick="setCast()">标记实际出演</button><button onclick="setType()">设置镜头类型</button><pre id="castresult"></pre></section><section><h2>状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="castconflict" type="number" placeholder="出演冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><button onclick="exemptCast()">豁免出演冲突</button><pre id="result"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}function report(){get('/api/productions/'+production.value+'/continuity','#state')}function state0(){get('/api/state','#state')}function addActor(){post('/api/productions/'+production.value+'/actors',{name:actorname.value,note:actornote.value},'#cast')}function addRole(){post('/api/productions/'+production.value+'/roles',{name:rolename.value,lead_actor_id:+leadactor.value,note:rolenote.value},'#cast')}function changeLead(){post('/api/roles/'+role.value+'/lead',{actor_id:+actor.value,user_id:+user.value},'#cast')}function addStandin(){post('/api/roles/'+role.value+'/standins',{actor_id:+actor.value,user_id:+user.value},'#cast')}function removeStandin(){post('/api/roles/'+role.value+'/standins/remove',{actor_id:+actor.value,user_id:+user.value},'#cast')}function fileRotation(){post('/api/roles/'+role.value+'/filings',{actor_id:+actor.value,reason:reason.value,reviewer_id:+reviewer.value},'#cast')}function setCast(){post('/api/shots/'+shot.value+'/cast',{role_id:+role.value,actor_id:+actor.value,user_id:+user.value},'#castresult')}function setType(){post('/api/shots/'+shot.value+'/type',{shot_type:shottype.value,user_id:+user.value},'#castresult')}function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value})}function check(){post('/api/scenes/'+scene.value+'/check',{})}function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value})}function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}function exemptCast(){post('/api/cast-conflicts/'+castconflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}report()</script></html>
